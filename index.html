<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VACA Palco">
<meta name="theme-color" content="#07060a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<title>VACA Palco</title>
<style>
  /* Layout: palco preto em cima (vai pro Resolume), faixa de controles baixa colada embaixo (corte no Resolume). */
  :root {
    --bg: #07060a;
    --panel: #121019;
    --panel-hi: #1c1827;
    --line: #2b2540;
    --fg: #f1eefb;
    --muted: #8d86a8;
    --accent: #c6ff3d;
    --cut: #ff3d8b;
    --display: "Syne", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --strip-h: 88px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  html { background: var(--bg); overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.3 var(--mono);
    margin: 0; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
  .app > * { min-width: 0; }

  /* PALCO */
  .stage { position: relative; background: #000; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .empty {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px;
    color: var(--muted); pointer-events: none; padding: 16px;
  }
  .empty b { font: 800 clamp(22px, 4vw, 40px)/1 var(--display); color: var(--fg); letter-spacing: -.01em; }
  .empty span { font-size: 13px; letter-spacing: .04em; }

  /* FAIXA DE CONTROLES */
  .strip {
    background: var(--panel); position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr);
    grid-template-columns: minmax(0, 1fr); min-width: 0;
    box-sizing: border-box; height: calc(var(--strip-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .strip::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 2px dashed var(--cut); }
  .inner { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  .tabs { display: flex; gap: 6px; align-items: center; padding-block: 6px 4px; }
  .tab {
    font: 800 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase;
    padding: 0 14px; border-radius: 6px; color: var(--muted); min-height: 30px;
  }
  .tab[aria-selected="true"] { color: var(--bg); background: var(--accent); }
  .cut-note { margin-left: auto; font-size: 10px; letter-spacing: .06em; color: var(--cut); text-transform: uppercase; }

  .strip > .inner.body { display: flex; min-height: 0; padding-bottom: 6px; }
  .panel { display: none; min-height: 0; flex: 1; min-width: 0; }
  .panel.on { display: flex; gap: 8px; align-items: stretch; }

  /* Carregar */
  .big { flex: none; display: grid; align-content: center; gap: 1px; padding: 0 16px; min-width: 150px; background: var(--fg); color: var(--bg); border-radius: 8px; text-align: left; }
  .big b { font: 800 15px/1.1 var(--display); }
  .big small { font-size: 10px; color: #4a4560; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; align-items: stretch; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .thumb {
    flex: none; width: 66px; position: relative; border-radius: 6px; overflow: hidden;
    background: #000 repeating-conic-gradient(#14111d 0 25%, #0b0910 0 50%) 0 0 / 12px 12px; border: 2px solid var(--line);
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .thumb span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 8px; padding: 1px 4px; background: rgba(7,6,10,.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb[aria-pressed="true"] { border-color: var(--accent); }

  /* Efeitos */
  .chips { display: flex; gap: 6px; flex: 0 1 auto; max-width: 46%; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: stretch; border: 2px solid var(--line); border-radius: 8px; background: var(--panel-hi); overflow: hidden; }
  .chip[aria-selected="true"] { border-color: var(--fg); }
  .chip .nm { padding: 0 12px; font: 800 13px/1 var(--display); }
  .chip .dt { width: 38px; display: grid; place-items: center; border-left: 2px solid var(--line); }
  .chip .dt i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
  .chip[data-on="true"] .dt i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .sliders { display: flex; gap: 14px; flex: 1; min-width: 0; align-items: center; padding-left: 8px; border-left: 2px solid var(--line); }
  .sl { flex: 1; min-width: 0; display: grid; gap: 1px; }
  .sl span { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
  .sl em { font-style: normal; color: var(--fg); font-variant-numeric: tabular-nums; }
  .sl input { width: 100%; height: 24px; margin: 0; accent-color: var(--accent); touch-action: pan-y; }

  /* Palco */
  .seg { display: flex; gap: 6px; }
  .seg button { background: var(--panel-hi); border: 2px solid var(--line); border-radius: 6px; padding: 0 14px; font-weight: 600; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .go { padding: 0 16px; border-radius: 8px; font: 800 13px/1.1 var(--display); text-align: left; background: var(--panel-hi); border: 2px solid var(--line); }
  .go small { display: block; font: 400 9px/1.3 var(--mono); opacity: .85; margin-top: 2px; }
  .go.live { margin-left: auto; background: var(--cut); border-color: var(--cut); color: #fff; }

  body.live .strip { display: none; }
  .corner { position: fixed; left: 0; bottom: 0; width: 72px; height: 72px; z-index: 5; display: none; }
  body.live .corner { display: block; }
  @media (prefers-reduced-motion: no-preference) { .tab, .thumb, .chip { transition: border-color .12s, background .12s; } }
  @media (max-width: 900px) { .cut-note { display: none; } .go small { display: none; } .sliders { gap: 8px; } .chip .nm { padding: 0 8px; } }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="empty" id="empty">
      <b>Palco vazio</b>
      <span>Toque em ABRIR PASTA e escolha um PNG da pasta iPad no Drive</span>
    </div>
  </main>

  <footer class="strip" id="strip">
    <div class="inner tabs" role="tablist">
      <button class="tab" role="tab" id="t-load" aria-selected="true" data-tab="load">Carregar</button>
      <button class="tab" role="tab" id="t-fx" aria-selected="false" data-tab="fx">Efeitos</button>
      <button class="tab" role="tab" id="t-set" aria-selected="false" data-tab="set">Palco</button>
      <span class="cut-note"><span id="ver"></span> · corte aqui no Resolume ↑</span>
    </div>

    <div class="inner body">
      <section class="panel on" id="p-load" role="tabpanel" aria-labelledby="t-load">
        <button class="big" id="openBtn"><b>Abrir pasta</b><small>Drive › iPad</small></button>
        <div class="thumbs" id="thumbs"></div>
      </section>

      <section class="panel" id="p-fx" role="tabpanel" aria-labelledby="t-fx">
        <div class="chips" id="chips"></div>
        <div class="sliders" id="sliders"></div>
      </section>

      <section class="panel" id="p-set" role="tabpanel" aria-labelledby="t-set">
        <div class="seg" id="fitSeg">
          <button data-fit="contain" aria-pressed="true">Caber</button>
          <button data-fit="cover" aria-pressed="false">Preencher</button>
          <button data-fit="fill" aria-pressed="false">Esticar</button>
        </div>
        <button class="go" id="clearBtn">Apagar salvos<small>remove as imagens do app</small></button>
        <button class="go" id="updBtn">Atualizar app<small id="updSm">precisa de internet</small></button>
        <button class="go live" id="liveBtn">Modo Palco<small>esconde a faixa · 3 toques no canto inferior esquerdo volta</small></button>
      </section>
    </div>
  </footer>
</div>
<button class="corner" id="corner" aria-label="Mostrar controles"></button>
<input type="file" id="file" accept="image/png,image/*" multiple hidden>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), stage = $('stage');
  var state = { imgs: [], cur: -1, fit: 'contain' };
  var APP_VERSION = '8';
  $('ver').textContent = 'v' + APP_VERSION;

  /* =============== EFEITOS: definição e ajustes =============== */
  function P(l, min, max, step, v, f, names) { return { l: l, min: min, max: max, step: step, v: v, f: f, names: names }; }
  var FX = {
    ripple:  { name: 'Ondas',       on: true,  p: { size: P('Tamanho', 0.02, 0.6, 0.005, 0.08, 2), range: P('Alcance', 0.2, 3.6, 0.05, 0.9, 2), press: P('Pressão', 0, 3, 0.05, 0.8, 2), speed: P('Velocidade', 0.2, 5, 0.05, 0.7, 2) } },
    chroma:  { name: 'Cromática',   on: true,  p: { width: P('Largura', 8, 280, 1, 46, 0), amt: P('Intensidade', 0, 4, 0.05, 1, 2), persist: P('Persistência', 0.2, 8, 0.1, 1.2, 1) } },
    haze:    { name: 'Miragem',     on: false, p: { area: P('Área', 0.05, 1.2, 0.01, 0.22, 2), amt: P('Intensidade', 0, 6, 0.05, 1.8, 2), freq: P('Frequência', 6, 120, 1, 26, 0) } },
    fluid:   { name: 'Fluido',      on: false, p: { visc: P('Viscosidade', 0, 1, 0.01, 0.25, 2), turb: P('Turbulência', 0, 120, 1, 6, 0), ret: P('Retorno', 0.3, 20, 0.1, 4, 1) } },
    marble:  { name: 'Marmorizado', on: false, p: { scale: P('Escala', 0.5, 12, 0.1, 4, 1), flow: P('Fluxo', 0, 6, 0.05, 1.5, 2), persist: P('Persistência', 0.5, 40, 0.5, 8, 1) } },
    melt:    { name: 'Derreter',    on: false, p: { thick: P('Espessura', 0.3, 12, 0.1, 3, 1), speed: P('Velocidade', 0.2, 10, 0.1, 2, 1), reach: P('Alcance', 0.05, 1.2, 0.01, 0.25, 2) } },
    parts:   { name: 'Partículas',  on: false, p: { count: P('Quantidade', 2, 200, 1, 40, 0), size: P('Tamanho', 1, 60, 1, 10, 0), grav: P('Gravidade', -4, 4, 0.05, 0.6, 2) } },
    swarm:   { name: 'Enxame',      on: false, p: { count: P('Quantidade', 2, 200, 1, 30, 0), cohes: P('Coesão', 0, 6, 0.05, 1.2, 2), speed: P('Velocidade', 0.2, 8, 0.1, 1.5, 1) } },
    color:   { name: 'Colorama',    on: false, p: { pal: P('Paleta', 1, 5, 1, 1, 0, ['Arco-íris', 'Pôr do sol', 'Neon', 'Aurora', 'Fogo']), speed: P('Velocidade', 0, 6, 0.05, 0.6, 2), reach: P('Alcance', 0.05, 5, 0.05, 0.5, 2) } },
    bloom:   { name: 'Floração',    on: false, p: { size: P('Tamanho', 0.1, 4, 0.05, 0.5, 2), spread: P('Espalhar', 0.1, 6, 0.05, 0.7, 2), mix: P('Mistura', 0, 1, 0.01, 0.85, 2) } },
    echo:    { name: 'Eco',         on: false, p: { amt: P('Quantidade', 0, 1, 0.01, 0.75, 2), dist: P('Distância', 0, 16, 0.1, 3, 1), fade: P('Esmaecer', 0.05, 6, 0.05, 1.5, 2), reach: P('Alcance', 0.1, 4, 0.05, 0.5, 2) } }
  };
  var sel = 'ripple';

  function saveSettings() {
    try {
      var o = {};
      Object.keys(FX).forEach(function (k) { o[k] = { on: FX[k].on, v: {} }; Object.keys(FX[k].p).forEach(function (n) { o[k].v[n] = FX[k].p[n].v; }); });
      localStorage.setItem('vp-set-v3', JSON.stringify(o));
    } catch (e) {}
  }
  (function loadSettings() {
    try {
      var o = JSON.parse(localStorage.getItem('vp-set-v3') || localStorage.getItem('vp-set-v2') || '{}');
      Object.keys(FX).forEach(function (k) {
        if (!o[k]) return; FX[k].on = !!o[k].on;
        Object.keys(FX[k].p).forEach(function (n) { if (typeof o[k].v[n] === 'number') FX[k].p[n].v = o[k].v[n]; });
      });
    } catch (e) {}
  })();

  function renderChips() {
    var box = $('chips'); box.textContent = '';
    Object.keys(FX).forEach(function (k) {
      var c = document.createElement('div'); c.className = 'chip';
      c.setAttribute('aria-selected', k === sel ? 'true' : 'false'); c.dataset.on = FX[k].on ? 'true' : 'false';
      var nm = document.createElement('button'); nm.className = 'nm'; nm.textContent = FX[k].name;
      var dt = document.createElement('button'); dt.className = 'dt'; dt.setAttribute('aria-label', 'Ligar ou desligar ' + FX[k].name); dt.appendChild(document.createElement('i'));
      nm.addEventListener('click', function () { sel = k; renderChips(); renderSliders(); });
      dt.addEventListener('click', function () { FX[k].on = !FX[k].on; saveSettings(); renderChips(); });
      c.append(nm, dt); box.appendChild(c);
    });
  }
  function valText(d) { return d.names ? d.names[Math.round(d.v) - 1] : d.v.toFixed(d.f); }
  function renderSliders() {
    var box = $('sliders'); box.textContent = '';
    var Pm = FX[sel].p;
    Object.keys(Pm).forEach(function (n) {
      var d = Pm[n], lab = document.createElement('label'); lab.className = 'sl';
      var sp = document.createElement('span'), em = document.createElement('em');
      sp.textContent = d.l; em.textContent = valText(d); sp.appendChild(em);
      var inp = document.createElement('input'); inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step; inp.value = d.v;
      inp.addEventListener('input', function () { d.v = parseFloat(inp.value); em.textContent = valText(d); saveSettings(); });
      lab.append(sp, inp); box.appendChild(lab);
    });
  }
  renderChips(); renderSliders();

  /* =============== SHADERS =============== */
  var HDR = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\n';
  var VS_FULL = HDR + 'in vec2 a; out vec2 vUv; void main(){ vUv = a * .5 + .5; gl_Position = vec4(a, 0., 1.); }';

  // --- fluido (Navier-Stokes) ---
  var FS_ADV = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel, uSrc; uniform vec2 uTexel; uniform float uDt, uDiss;\n' +
    'void main(){ vec2 c = vUv - uDt * texture(uVel, vUv).xy * uTexel; o = texture(uSrc, c) / (1. + uDiss * uDt); }';
  var FS_MAPADV = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel, uMap; uniform vec2 uTexel; uniform float uDt, uRelax;\n' +
    'void main(){ vec2 c = vUv - uDt * texture(uVel, vUv).xy * uTexel; vec2 m = texture(uMap, c).xy; vec2 id = vec2(vUv.x, 1. - vUv.y);\n' +
    '  o = vec4(mix(m, id, 1. - exp(-uRelax * uDt)), 0., 1.); }';
  var FS_MAPINIT = HDR + 'in vec2 vUv; out vec4 o; void main(){ o = vec4(vUv.x, 1. - vUv.y, 0., 1.); }';
  var FS_FORCE = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel; uniform vec4 uFp[4], uFv[4]; uniform vec4 uFluid, uMarble, uMelt; uniform vec2 uAsp; uniform float uTime, uDt;\n' +
    'void main(){\n' +
    '  vec2 v = texture(uVel, vUv).xy;\n' +
    '  for (int k = 0; k < 4; k++) {\n' +
    '    if (uFp[k].z < .5) continue;\n' +
    '    vec2 p = (vUv - uFp[k].xy) * uAsp; float r2 = dot(p, p); float rr = sqrt(r2);\n' +
    '    if (uFluid.x > .5) { float g = exp(-r2 / uFluid.y); v = mix(v, uFv[k].xy * uFluid.z, clamp(g * uFluid.w * uDt, 0., 1.)); }\n' +
    '    if (uMarble.x > .5) { float g = exp(-r2 / uMarble.y); vec2 td = vec2(-p.y, p.x) / (rr + .02); float an = uTime * .9 + float(k) * 2.1;\n' +
    '      vec2 nz = vec2(sin(p.y * uMarble.z + an), cos(p.x * uMarble.z - an * 1.3));\n' +
    '      v += (td * sin(an * .7 + rr * uMarble.z * .5) + nz * .6) * g * uMarble.w * uDt * 40.; }\n' +
    '    if (uMelt.x > .5) { float rm = uMelt.w; float g = (p.y < 0.) ? exp(-(p.x * p.x / rm + p.y * p.y / (rm * 10.))) : exp(-r2 / rm);\n' +
    '      float n = .5 + .5 * sin(vUv.x * uMelt.y * 6.28318 + sin(vUv.x * uMelt.y * 13. + float(k)) * 2.); float gate = smoothstep(.25, .8, n);\n' +
    '      v.y -= g * gate * uMelt.z * uDt * 30.; v.x *= 1. - g * .05; }\n' +
    '  }\n' +
    '  v = clamp(v, vec2(-500.), vec2(500.)); o = vec4(v, 0., 1.);\n' +
    '}';
  var FS_CURL = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel; uniform vec2 uTexel;\n' +
    'void main(){ float L = texture(uVel, vUv - vec2(uTexel.x, 0.)).y, R = texture(uVel, vUv + vec2(uTexel.x, 0.)).y, T = texture(uVel, vUv + vec2(0., uTexel.y)).x, B = texture(uVel, vUv - vec2(0., uTexel.y)).x; o = vec4(.5 * (R - L - T + B), 0., 0., 1.); }';
  var FS_VORT = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel, uCurl; uniform vec2 uTexel; uniform float uK, uDt;\n' +
    'void main(){ float L = texture(uCurl, vUv - vec2(uTexel.x, 0.)).x, R = texture(uCurl, vUv + vec2(uTexel.x, 0.)).x, T = texture(uCurl, vUv + vec2(0., uTexel.y)).x, B = texture(uCurl, vUv - vec2(0., uTexel.y)).x, C = texture(uCurl, vUv).x;\n' +
    '  vec2 f = .5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); f /= length(f) + 1e-4; f *= uK * C; f.y *= -1.;\n' +
    '  o = vec4(clamp(texture(uVel, vUv).xy + f * uDt, vec2(-500.), vec2(500.)), 0., 1.); }';
  var FS_DIV = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uVel; uniform vec2 uTexel;\n' +
    'void main(){ float L = texture(uVel, vUv - vec2(uTexel.x, 0.)).x, R = texture(uVel, vUv + vec2(uTexel.x, 0.)).x, T = texture(uVel, vUv + vec2(0., uTexel.y)).y, B = texture(uVel, vUv - vec2(0., uTexel.y)).y; vec2 C = texture(uVel, vUv).xy;\n' +
    '  if (vUv.x - uTexel.x < 0.) L = -C.x; if (vUv.x + uTexel.x > 1.) R = -C.x; if (vUv.y + uTexel.y > 1.) T = -C.y; if (vUv.y - uTexel.y < 0.) B = -C.y;\n' +
    '  o = vec4(.5 * (R - L + T - B), 0., 0., 1.); }';
  var FS_PRES = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uP, uDiv; uniform vec2 uTexel;\n' +
    'void main(){ float L = texture(uP, vUv - vec2(uTexel.x, 0.)).x, R = texture(uP, vUv + vec2(uTexel.x, 0.)).x, T = texture(uP, vUv + vec2(0., uTexel.y)).x, B = texture(uP, vUv - vec2(0., uTexel.y)).x; o = vec4((L + R + B + T - texture(uDiv, vUv).x) * .25, 0., 0., 1.); }';
  var FS_GRAD = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uP, uVel; uniform vec2 uTexel;\n' +
    'void main(){ float L = texture(uP, vUv - vec2(uTexel.x, 0.)).x, R = texture(uP, vUv + vec2(uTexel.x, 0.)).x, T = texture(uP, vUv + vec2(0., uTexel.y)).x, B = texture(uP, vUv - vec2(0., uTexel.y)).x; o = vec4(texture(uVel, vUv).xy - vec2(R - L, T - B), 0., 1.); }';
  var FS_SCALE = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uT; uniform float uK; void main(){ o = texture(uT, vUv) * uK; }';

  // --- rastro cromático (por dedo) e campo de energia ---
  var FS_TRAIL = HDR + 'in vec2 vUv; out vec4 o; uniform sampler2D uTr; uniform vec4 uS0[4], uS1[4], uCol[4]; uniform vec2 uAsp; uniform float uDecay, uR;\n' +
    'void main(){ vec4 t = texture(uTr, vUv) * uDecay; vec2 p = vUv * uAsp;\n' +
    '  for (int k = 0; k < 4; k++) { if (uCol[k].w < .5) continue;\n' +
    '    vec2 a = uS0[k].xy * uAsp, b = uS1[k].xy * uAsp, pa = p - a, ba = b - a;\n' +

  if (!initGL()) { $('empty').hidden = false; $('empty').querySelector('span').textContent = 'Este iPad não conseguiu iniciar os efeitos (WebGL2). Atualize o iPadOS.'; initTargets(); }
  requestAnimationFrame(frame);
  openDB().then(function (d) { DB = d; loadSaved(); });
})();
